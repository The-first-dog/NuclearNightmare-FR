name: Build and publish French translation

on:
  push:
    branches: [main]
    paths:
      - 'build/ru/Game.locres.b64'
      - '.github/workflows/build-test-pak.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-pak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Decode and verify French localization
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p staging/NuclearNightmare/Content/Localization/Game/ru
          base64 --decode build/ru/Game.locres.b64 > staging/NuclearNightmare/Content/Localization/Game/ru/Game.locres
          echo 'b6e66e8f6f241bcf9f5aff065fd0160bbdc8c89b146e50780b337792257d3717  staging/NuclearNightmare/Content/Localization/Game/ru/Game.locres' | sha256sum --check -

      - name: Download repak v0.2.3
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tooling
          curl -fL --retry 3 'https://github.com/trumank/repak/releases/download/v0.2.3/repak_cli-x86_64-unknown-linux-gnu.tar.xz' -o tooling/repak.tar.xz
          tar -xJf tooling/repak.tar.xz -C tooling
          REPAK=$(find tooling -type f \( -name repak -o -name repak_cli \) -print -quit)
          test -n "$REPAK"
          chmod +x "$REPAK"
          echo "REPAK=$(realpath "$REPAK")" >> "$GITHUB_ENV"

      - name: Build Unreal Engine V11 override archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p install/NuclearNightmare/Content/Paks
          PAK="install/NuclearNightmare/Content/Paks/NuclearNightmare-FR_P.pak"
          "$REPAK" pack staging "$PAK" --version V11 --path-hash-seed 1111855876 --mount-point '../../../'
          test -s "$PAK"

      - name: Independent archive verification with repak
        shell: bash
        run: |
          set -euo pipefail
          PAK="install/NuclearNightmare/Content/Paks/NuclearNightmare-FR_P.pak"
          "$REPAK" info "$PAK"
          "$REPAK" list "$PAK" | grep -Fx 'NuclearNightmare/Content/Localization/Game/ru/Game.locres'
          "$REPAK" get "$PAK" 'NuclearNightmare/Content/Localization/Game/ru/Game.locres' > recovered.locres
          cmp recovered.locres staging/NuclearNightmare/Content/Localization/Game/ru/Game.locres

      - name: Create single-file installation ZIP with checksums
        shell: bash
        run: |
          set -euo pipefail
          (cd install && zip -q -r ../NuclearNightmare-FR-v1.0.0-rc.1.zip NuclearNightmare)
          sha256sum NuclearNightmare-FR-TEST.zip > SHA256SUMS.txt
          unzip -l NuclearNightmare-FR-TEST.zip
          test "$(unzip -Z1 NuclearNightmare-FR-TEST.zip | grep -c '\.pak$')" -eq 1

      - name: Publish test artifact
        uses: actions/upload-artifact@v4
        with:
          name: NuclearNightmare-FR-v1.0.0-rc.1
          path: |
            NuclearNightmare-FR-TEST.zip
            SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish candidate GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v1.0.0-rc.1"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" NuclearNightmare-FR-v1.0.0-rc.1.zip SHA256SUMS.txt --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=true \
              --title "Nuclear Nightmare — Traduction française v1.0.0 RC1"
          else
            gh release create "$TAG" NuclearNightmare-FR-v1.0.0-rc.1.zip SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Nuclear Nightmare — Traduction française v1.0.0 RC1" \
              --notes "Traduction française non officielle de Nuclear Nightmare (1 463 clés). Télécharger l'archive ZIP, copier le dossier NuclearNightmare dans le dossier principal du jeu, puis sélectionner Russe dans les paramètres. Aucun exécutable fourni, mod .pak indépendant. Version candidate : certaines formulations et compatibilités restent à contrôler en jeu. Consultez le README et le guide d'installation." \
              --prerelease
          fi
